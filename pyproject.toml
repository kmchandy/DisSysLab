[project]
name = "dissyslab"
version = "1.10.1"
description = "DisSysLab — build continuous offices of specialist agents in plain English."
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "K. Mani Chandy", email = "kmchandy@gmail.com" }]
keywords = [
  "distributed-systems",
  "agents",
  "ai",
  "education",
  "claude",
  "anthropic",
  "llm",
  "dataflow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]

# Core dependencies: everything needed to run the built-in components.
# Image deps (Pillow, numpy, scipy) are in core because several gallery
# offices use them (M07, M08), and students should get a working install
# out of the box. Tests live under dev.
dependencies = [
  "anthropic>=0.39.0",
  "python-dotenv>=1.0.0",
  "feedparser>=6.0.11",
  "requests>=2.31.0",
  "websocket-client>=1.6.0",
  "beautifulsoup4>=4.12.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
# Market data. Deliberately NOT a core dependency.
#
# Two reasons, and the second is the load-bearing one. yfinance pulls
# pandas, and the offices a first-year runs first -- periodic_brief,
# my_first_office, situation_room -- need no market data at all; making
# every student carry it to run a news brief is the wrong default.
#
# And Yahoo's terms do not permit redistributing their data, so we ship
# none of it: no prices, no cached quotes, no sample market CSVs. Every
# user fetches their own, which means the fetching tool has to be
# something they install deliberately rather than something that arrives
# by accident. See mac_speed_suite/download_stock_history_from_yf.py.
market = [
  "yfinance>=0.2.40",
  # explain_strategy.py writes the per-bar working as a spreadsheet with
  # live formulas, which is how a non-programmer checks that the
  # implemented rule is the one they meant. Same extra as the data it
  # explains, so one install covers the whole backtesting path.
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.1.0",
  "ruff>=0.6.9",
  "black>=24.8.0",
  "build>=1.2.1",
  "twine>=5.1.1",
]

[project.scripts]
dsl = "dissyslab.cli:main"

[project.urls]
Homepage = "https://github.com/kmchandy/DisSysLab"
Source = "https://github.com/kmchandy/DisSysLab"
Documentation = "https://github.com/kmchandy/DisSysLab#readme"
Issues = "https://github.com/kmchandy/DisSysLab/issues"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dissyslab*"]
exclude = [
  "tests*", "examples*", "gallery*", "dev*", "site*", "micro_course*",
  # `dsl build` writes <office>/build/__init__.py next to run.py, which
  # makes the codegen output look like a real sub-package to
  # packages.find. It is then shipped as *source*, where
  # exclude-package-data cannot reach it -- that rule only governs data
  # files inside packages, not the packages themselves. This is why
  # v1.7.0 shipped 64 build/*.py files. Both patterns are needed:
  # the first drops the build package, the second anything under it.
  #
  # The wildcard is `gallery.*.*` rather than `gallery.apps.*` because
  # the first version of this rule named the folder where the leak was
  # observed instead of the invariant it was defending. `dsl build`
  # writes build/ next to any office.md, and gallery/examples/ holds
  # offices too -- so a machine that had ever run `my_first_office`
  # shipped it. Same bug, second folder, found by the same test.
  "dissyslab.gallery.*.*.build",
  "dissyslab.gallery.*.*.build.*",
]

# Package data shipped inside the wheel.
#
# - gallery/**/*.md + gallery/**/*.py — every gallery office (office.md,
#   README.md, roles/*.md, app.py, etc.) so `dsl list` and `dsl init`
#   can find and copy them.
# - roles/**/*.md — the framework's built-in role library
#   (entity_extractor, severity_classifier, writer, evaluator, etc.).
#   Without these, every office that uses a library role fails at
#   compile time with "no such role is in the library". This was
#   the cause of issue #126 (v1.3.1 wheel shipped no library roles).
#
# Internal design docs that used to live at the dissyslab package root
# have moved to docs/internals/ (architecture.md, core_overview.md,
# network_overview.md, etc.) and are out of the package tree entirely,
# so they cannot ship by accident.
#
# The globs below are NOT narrow, and an earlier version of this comment
# claimed they were. They read the *working tree*, not git, so any
# untracked file matching them ships -- .gitignore is irrelevant here.
# v1.7.0 was built from a tree containing generated output and shipped
# 71 files that do not belong in a wheel: 32 offices' worth of generated
# build/run.py, paper_trader's book/book.json (a live trading book), and
# six recovery_demo checkpoints. `dsl init` then copied them into every
# student's folder. See exclude-package-data below, which is what makes
# the claim true rather than the glob shape.
[tool.setuptools.package-data]
"dissyslab" = [
  "py.typed",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.txt",
  "gallery/**/*.md",
  "gallery/**/*.py",
  "roles/**/*.md",
  # The office.md reference, printed by `dsl grammar`. It lives in the
  # package rather than inside the skill so that the language and the
  # description of the language ship together and cannot disagree --
  # and so that changing the grammar does not require every user to
  # re-save a skill.
  "reference/*.md",
]

# Generated and runtime output that lives inside gallery app folders.
# These are gitignored, but package-data globs read the working tree,
# so a build on a machine that has ever *run* an office would ship them
# without this. Each entry names something a run produces:
#
# - build/     — `dsl build` / `dsl run` codegen output (run.py). Stale
#                copies trigger cli.py's "old import path" failure.
# - snapshots/ — checkpoint-recovery output. Shipping these means a
#                student's `dsl run recovery_demo --resume latest`
#                silently resumes someone else's June checkpoint
#                instead of reporting that no snapshot exists.
# - book/      — paper_trader's persistent ledger (cash, positions,
#                realized P&L). Not ours to ship.
[tool.setuptools.exclude-package-data]
"dissyslab" = [
  "gallery/*/*/build/*",
  "gallery/*/*/snapshots/*",
  "gallery/*/*/snapshots/**/*",
  "gallery/*/*/book/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# pythonpath adds the repo root to sys.path so `from dissyslab import ...`
# works in tests even without the package being pip-installed first.
# Carried over from the now-removed pytest.ini.
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
