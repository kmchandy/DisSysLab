# Run the test suite on every push to main and every pull request.
#
# Platform coverage exists because a tester on Windows found four
# glibc-only strftime directives that stopped `periodic_brief` from
# running at all, plus a class of cp1252 decoding failures -- none of
# which a Linux-only matrix can see. The README makes a claim about
# which platforms work; this file is what turns that claim from an
# assertion into something checked.
#
# Full Python matrix on Linux (cheapest); one representative version on
# macOS and Windows. Windows is advisory for now -- see below.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows still has known failures (checkpoint teardown holds a file
    # open; Windows will not unlink an open file the way POSIX does).
    # Reported, not yet fixed. Until it is, Windows runs and reports but
    # does not gate the merge. Flip this to `false` -- i.e. delete the
    # line -- once the Windows job is green.
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # Confirm the two platforms the README names, on one version each.
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check the install reports itself healthy
        run: dsl doctor

      - name: Run the test suite
        run: pytest tests/ -q
